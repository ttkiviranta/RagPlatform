name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json

      - name: Restore solution
        run: dotnet restore RagPlatform.slnx

      - name: Restore local tools
        run: dotnet tool restore

      - name: Build solution
        run: dotnet build RagPlatform.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test RagPlatform.Api.Tests/RagPlatform.Api.Tests.csproj --configuration Release --no-build --filter "TestCategory=Unit" --logger "trx;LogFileName=unit-tests.trx" --results-directory TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14